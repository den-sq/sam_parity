name: Rust CI

env:
  # den-sq/candle_sam3#10 merged the certified F16 candidate at this exact main revision.
  CANDLE_SAM3_BRANCH: main
  CANDLE_SAM3_SHA: 32882747726e4803af494a6e67f47098f45c9893

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo check CLI
        run: cargo check -p sam3-parity-cli

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo test
        run: cargo test --workspace

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - name: Rustfmt
        run: cargo fmt --package sam3-parity-lib --package sam3-parity-cli -- --check
