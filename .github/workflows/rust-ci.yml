name: Rust CI

env:
  # Temporary stacked-candidate pin. Return to main after candle_sam3 PR #9 lands.
  CANDLE_SAM3_BRANCH: codex/candle-2-09-throughput-candidate
  CANDLE_SAM3_SHA: 71690361a0e4eb839cfc22a52fcdf5cfbf047f0a

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo check CLI
        run: cargo check -p sam3-parity-cli

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo test
        run: cargo test --workspace

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - name: Rustfmt
        run: cargo fmt --package sam3-parity-lib --package sam3-parity-cli -- --check
