name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CANDLE_SAM3_COMMIT: 104948e6a19d36cbe66c67bbe8c8f87b96485872

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone https://github.com/den-sq/candle_sam3 ../candle_sam3
          git -C ../candle_sam3 checkout "${CANDLE_SAM3_COMMIT}"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo check CLI
        run: cargo check -p sam3-parity-cli

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone https://github.com/den-sq/candle_sam3 ../candle_sam3
          git -C ../candle_sam3 checkout "${CANDLE_SAM3_COMMIT}"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo test
        run: cargo test --workspace

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone https://github.com/den-sq/candle_sam3 ../candle_sam3
          git -C ../candle_sam3 checkout "${CANDLE_SAM3_COMMIT}"
      - name: Rustfmt
        run: cargo fmt --package sam3-parity-lib --package sam3-parity-cli -- --check
