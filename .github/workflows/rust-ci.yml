name: Rust CI

env:
  # PR #47's CUDA fixtures certify the F16 candidate at this exact reachable revision.
  CANDLE_SAM3_BRANCH: codex/candle-2-13-f16-turing
  CANDLE_SAM3_SHA: 95e0c186cdf7a7d51224659a103ce73294b7efad

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo check CLI
        run: cargo check -p sam3-parity-cli

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: Swatinem/rust-cache@v2
      - name: Cargo test
        run: cargo test --workspace

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - name: Rustfmt
        run: cargo fmt --package sam3-parity-lib --package sam3-parity-cli -- --check
