name: Nightly Video Parity

env:
  # den-sq/candle_sam3#10 merged the provisionally accepted F16 implementation at this exact main revision.
  CANDLE_SAM3_BRANCH: main
  CANDLE_SAM3_SHA: 32882747726e4803af494a6e67f47098f45c9893

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  gpu-video-parity:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v6
      - name: Clone Candle SAM3 path dependency
        run: |
          git clone --depth 1 --branch "$CANDLE_SAM3_BRANCH" https://github.com/den-sq/candle_sam3 ../candle_sam3
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python tooling
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run lightweight schema checks
        run: cargo test -p sam3-parity-lib
      - name: Run parity matrix
        env:
          SAM3_PARITY_CANDLE_SHA: ${{ github.sha }}
        run: |
          echo "Set repo-specific checkpoint and upstream path env vars before enabling this workflow in CI."
          cargo test -p sam3-parity-cli -- --ignored --nocapture
