name: Nightly Video Parity

env:
  # Fetch the frozen production candidate directly; unrelated movement on Candle main must not break this workflow.
  CANDLE_SAM3_SHA: c0400c6513c21655828bb92633cc190a3501a6f6

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  gpu-video-parity:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v6
      - name: Clone Candle SAM3 path dependency
        run: |
          git init ../candle_sam3
          git -C ../candle_sam3 remote add origin https://github.com/den-sq/candle_sam3
          git -C ../candle_sam3 fetch --depth 1 origin "$CANDLE_SAM3_SHA"
          git -C ../candle_sam3 checkout --detach FETCH_HEAD
          test "$(git -C ../candle_sam3 rev-parse HEAD)" = "$CANDLE_SAM3_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python tooling
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run lightweight schema checks
        run: cargo test -p sam3-parity-lib
      - name: Run parity matrix
        env:
          SAM3_PARITY_CANDLE_SHA: ${{ github.sha }}
        run: |
          echo "Set repo-specific checkpoint and upstream path env vars before enabling this workflow in CI."
          cargo test -p sam3-parity-cli -- --ignored --nocapture
